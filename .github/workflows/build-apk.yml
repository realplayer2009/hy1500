name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Set up Qt 5.15 for Android
        uses: actions/setup-qt@v4
        with:
          qt-version: 5.15.2
          target: android
          modules: qtandroidextras qtserialport

      - name: Install Android build dependencies
        run: |
          sdkmanager --sdk_root="$ANDROID_HOME" "platforms;android-33" "build-tools;28.0.3" "build-tools;34.0.0" "ndk;21.4.7075529"

      - name: Build APK
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/21.4.7075529"
          export QT_ANDROID_ROOT="$(qmake -query QT_INSTALL_PREFIX)"
          ./android/build_apk.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RS485Launcher-arm64-v8a
          path: android/dist/*.apk
