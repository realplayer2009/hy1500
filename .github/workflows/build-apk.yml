name: Native Android APK Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # runner 预装的 cmdline-tools sdkmanager 需要 Java 17 (class file 65),
      # 而 Gradle 5.6.4 只能跑在 JDK 11 上。因此先用 17 装 SDK/NDK,
      # 装完再切回 11 编译, 两者不冲突。
      - name: Set up JDK 17 (for sdkmanager)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Qt 5.15 for Android
        uses: jurplel/install-qt-action@v4
        with:
          version: 5.15.2
          target: android
          # Qt 5.15 的 android 包是单个 Android_ANY-Multi 包 (含全部 ABI),
          # qtbase/qtserialport/qtandroidextras 都是该包内的 archive 而非独立
          # module, 因此不能用 modules 输入 (aqt 会报 packages not found)。
          # 不指定 modules 时安装整个基础包, 已含 core/gui/widgets/serialport/
          # androidextras; arm64 由 build_apk.sh 的 ANDROID_ABIS 选出。
          arch: android

      - name: Install Android build dependencies
        run: |
          set -uo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "=== 安装前磁盘 ==="
          df -h / | tail -1
          # runner 镜像里 sdkmanager 不在 PATH, 位于 cmdline-tools/latest/bin 下
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then
            SDKMGR="$(find "$ANDROID_HOME" /usr/local/lib/android /opt/android-sdk \
              -name sdkmanager -type f 2>/dev/null | head -1)"
          fi
          if [ -z "$SDKMGR" ] || [ ! -x "$SDKMGR" ]; then
            echo "::error::sdkmanager not found under ANDROID_HOME=$ANDROID_HOME" >&2
            exit 1
          fi
          echo "Using sdkmanager: $SDKMGR"
          java -version
          # 逐个安装, 任一步失败即报出是哪个包
          for PKG in "platforms;android-33" "build-tools;28.0.3" "build-tools;34.0.0" "ndk;21.4.7075529"; do
            echo "::group::Installing $PKG"
            # 关键: 不能用 yes | sdkmanager 的直接退出码, 也不能用 || true 后读
            # PIPESTATUS (true 会冲掉 PIPESTATUS)。sdkmanager 正常结束后 yes 会因
            # 写不进已关闭的管道收到 SIGPIPE, 而 coreutils 的 yes 以退出码 1 结束;
            # 只要 pipefail 还开着, 整条管道就会被污染成 1, 把成功的安装判成失败。
            # 因此临时关掉 errexit 与 pipefail, 此时 $? 即 sdkmanager 的真实退出码,
            # 读完立即恢复, 保证后续命令仍受 -e 保护。
            set +e
            set +o pipefail
            yes | "$SDKMGR" --sdk_root="$ANDROID_HOME" "$PKG"
            RC=$?
            set -e
            set -o pipefail
            echo "::endgroup::"
            echo "=== $PKG -> sdkmanager exit $RC; 剩余磁盘 $(df -h / | awk 'NR==2{print $4}') ==="
            if [ "$RC" -ne 0 ]; then
              echo "::error::failed to install $PKG (sdkmanager exit $RC)"
              exit "$RC"
            fi
          done
          echo "=== 安装完成, 校验关键目录 ==="
          for D in "platforms/android-33" "build-tools/28.0.3" "build-tools/34.0.0" "ndk/21.4.7075529"; do
            if [ -d "$ANDROID_HOME/$D" ]; then
              echo "  ✅ $D"
            else
              echo "  ❌ $D 缺失"
              exit 1
            fi
          done

      # Gradle 5.6.4 不支持 JDK 17, 编译前切回 11
      - name: Set up JDK 11 (for Gradle 5.6.4)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Pin Android NDK to 21.4.7075529
        run: |
          set -euo pipefail
          # runner 镜像预装了多个 NDK (含 NDK 30)。Qt 5.15.2 模板的 build.gradle
          # 不设 android.ndkVersion, AGP 3.6.0 会回退到"SDK 里最新的 NDK",
          # 于是 :stripDebugDebugSymbols 用了 NDK 30: 其 meta/abis.json 含
          # AGP 3.6 不认识的 riscv64, 且该版本的 strip 工具起不来, 构建失败。
          # 本机 .android-toolchain/sdk 通常只有 21.4.7075529 一个 NDK, 因此
          # 只在 CI 这类预装多版本的环境处理。CI runner 是一次性环境, 这里把
          # 多余的 NDK 移到 /tmp 暂存(同一文件系统, 瞬间完成, 可恢复)。
          NDK_DIR="$ANDROID_HOME/ndk"
          KEEP="21.4.7075529"
          echo "现有 NDK:"; ls -1 "$NDK_DIR" 2>/dev/null || true
          mkdir -p /tmp/ndk-stash
          for d in "$NDK_DIR"/*; do
            [ -d "$d" ] || continue
            if [ "$(basename "$d")" != "$KEEP" ]; then
              echo "暂存 $(basename "$d")"
              mv "$d" /tmp/ndk-stash/
            fi
          done
          echo "保留后:"; ls -1 "$NDK_DIR"
          [ -d "$NDK_DIR/$KEEP" ] || { echo "::error::NDK $KEEP missing"; exit 1; }

      - name: Build APK
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/21.4.7075529"
          export QT_ANDROID_ROOT="$(qmake -query QT_INSTALL_PREFIX)"
          ./android/build_apk.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RS485Control-native-arm64-v8a
          path: android/dist/RS485Control-arm64-v8a-debug.apk
          if-no-files-found: error
