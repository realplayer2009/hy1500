name: Native Android APK Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # runner 预装的 cmdline-tools sdkmanager 需要 Java 17 (class file 65),
      # 而 Gradle 5.6.4 只能跑在 JDK 11 上。因此先用 17 装 SDK/NDK,
      # 装完再切回 11 编译, 两者不冲突。
      - name: Set up JDK 17 (for sdkmanager)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Qt 5.15 for Android
        uses: jurplel/install-qt-action@v4
        with:
          version: 5.15.2
          target: android
          # Qt 5.15 的 android 包是单个 Android_ANY-Multi 包 (含全部 ABI),
          # qtbase/qtserialport/qtandroidextras 都是该包内的 archive 而非独立
          # module, 因此不能用 modules 输入 (aqt 会报 packages not found)。
          # 不指定 modules 时安装整个基础包, 已含 core/gui/widgets/serialport/
          # androidextras; arm64 由 build_apk.sh 的 ANDROID_ABIS 选出。
          arch: android

      - name: Install Android build dependencies
        run: |
          set -uo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<unset>}"
          echo "=== 安装前磁盘 ==="
          df -h / | tail -2
          echo "--- Qt 占用 ---"
          du -sh "$GITHUB_WORKSPACE/Qt" 2>/dev/null || true
          echo "--- Android SDK 已占用 ---"
          du -sh "$ANDROID_HOME"/* 2>/dev/null | sort -h | tail -5 || true
          sudo apt-get clean >/dev/null 2>&1 || true
          # runner 镜像里 sdkmanager 不在 PATH, 位于 cmdline-tools/latest/bin 下
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then
            SDKMGR="$(find "$ANDROID_HOME" /usr/local/lib/android /opt/android-sdk \
              -name sdkmanager -type f 2>/dev/null | head -1)"
          fi
          if [ -z "$SDKMGR" ] || [ ! -x "$SDKMGR" ]; then
            echo "::error::sdkmanager not found under ANDROID_HOME=$ANDROID_HOME" >&2
            exit 1
          fi
          echo "Using sdkmanager: $SDKMGR"
          java -version
          # 逐个安装, 任一步失败即报出是哪个包以及当时的磁盘余量
          for PKG in "platforms;android-33" "build-tools;28.0.3" "build-tools;34.0.0" "ndk;21.4.7075529"; do
            echo "::group::Installing $PKG"
            yes | "$SDKMGR" --sdk_root="$ANDROID_HOME" "$PKG"
            RC=$?
            echo "::endgroup::"
            echo "=== $PKG -> exit $RC; 剩余磁盘: $(df -h / | awk 'NR==2{print $4}') ==="
            if [ $RC -ne 0 ]; then
              echo "::error::failed to install $PKG (exit $RC)"
              exit $RC
            fi
          done
          echo "=== 安装后磁盘 ==="
          df -h / | tail -2
          du -sh "$ANDROID_HOME"/* 2>/dev/null | sort -h | tail -5 || true

      # Gradle 5.6.4 不支持 JDK 17, 编译前切回 11
      - name: Set up JDK 11 (for Gradle 5.6.4)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Build APK
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/21.4.7075529"
          export QT_ANDROID_ROOT="$(qmake -query QT_INSTALL_PREFIX)"
          ./android/build_apk.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RS485Control-native-arm64-v8a
          path: android/dist/RS485Control-arm64-v8a-debug.apk
          if-no-files-found: error
